[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: 慢速测试，scripts/run_tests.py --quick 模式跳过
    integration: 集成测试（依赖 DB / 文件系统）
    unit: 单元测试（无外部依赖）
tmp_path_retention_policy = failed
addopts =
    --strict-markers
    -v
    --basetemp=.test-tmp
