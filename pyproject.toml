[project]
name = "wemedia-baby"
version = "1.3.6"
description = "一款面向自媒体创作者的专业批量发布工具"
authors = [
    {name = "媒小宝团队", email = "185034202@qq.com"}
]
dependencies = [
    "PySide6>=6.4.0",
    "PySide6-Fluent-Widgets>=1.5.0",
    "qasync>=0.27.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "keyring>=24.0.0",
    "APScheduler>=3.10.0",
    "pybreaker>=1.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
    "aiocache>=0.12.0",
    "tortoise-orm>=0.21.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "undetected-playwright>=0.3.0",
    "Send2Trash>=1.8.0",
    "PyYAML>=6.0.0",
    "psutil>=5.9.0",
    "python-dateutil>=2.8.0",
    "tenacity>=8.0.0",
    "watchdog>=3.0.0",
    "openpyxl>=3.1.0",
    "ffmpeg-python>=0.2.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["."]
extraPaths = ["."]
executionEnvironments = [{ root = ".", extraPaths = ["."] }]
